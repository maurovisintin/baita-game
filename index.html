<title>La Leggenda della Baita della Figata del Mondo</title>

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; cursor: none; -webkit-tap-highlight-color: transparent; }
  #ruota { display: none; position: fixed; inset: 0; background: #120b06; color: #f2e01c; font: 28px "VT323", monospace;
           flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; z-index: 5; }
  #ruota .icona { font-size: 64px; animation: gira 2s ease-in-out infinite; }
  #ruota small { color: #c9a35f; font-size: 20px; margin-top: 8px; }
  @keyframes gira { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #ruota { display: flex; } }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="ruota"><div class="icona">📱</div><div>Ruota il telefono</div><small>La baita si gioca in orizzontale</small></div>
